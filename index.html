<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tasks</title>
  <meta name="description" content="A clean, simple to-do list. Your tasks are saved in your browser." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1 class="title">My tasks</h1>
        <p class="date" id="today"></p>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to dark theme">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <section class="progress" aria-label="Progress">
      <div class="progress-text">
        <span id="progress-label">No tasks yet</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <form class="add-form" id="add-form" autocomplete="off">
      <label class="sr-only" for="new-task">New task</label>
      <input class="add-input" id="new-task" type="text" placeholder="What needs to be done?" maxlength="200" required />
      <select class="add-priority" id="new-priority" aria-label="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button class="btn btn-primary" type="submit">Add task</button>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <div class="segmented" role="group">
        <button class="seg-btn is-active" type="button" data-filter="all" aria-pressed="true">All <span class="count" id="count-all">0</span></button>
        <button class="seg-btn" type="button" data-filter="active" aria-pressed="false">Active <span class="count" id="count-active">0</span></button>
        <button class="seg-btn" type="button" data-filter="completed" aria-pressed="false">Completed <span class="count" id="count-completed">0</span></button>
      </div>
    </nav>

    <ul class="task-list" id="task-list" aria-live="polite"></ul>

    <div class="empty" id="empty-state" hidden>
      <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
      <p class="empty-title" id="empty-title">Nothing here yet</p>
      <p class="empty-text" id="empty-text">Add your first task above to get started.</p>
    </div>

    <footer class="app-footer">
      <span id="footer-count">0 tasks left</span>
      <button class="btn btn-ghost" id="clear-completed" type="button">Clear completed</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
